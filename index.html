<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerpusKuY — Modern TypeScript Digital Library</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --accent: #38bdf8;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.22);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark) 60%);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        header {
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span.ts-badge {
            font-size: 0.72rem;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
        }
        .container {
            max-width: 1220px;
            width: 92%;
            margin: 32px auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .stat-card h3 { font-size: 1.9rem; color: var(--accent); margin-bottom: 4px; }
        .stat-card p { font-size: 0.85rem; color: var(--text-muted); }
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            margin-bottom: 26px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .panel-title { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        input, select {
            background: #0b0f19;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }
        button.btn {
            background: var(--accent);
            color: #090d16;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button.btn-return {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid #10b981;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 13px 14px;
            text-align: left;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        }
        th { color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <span>⚡ PerpusKuY</span>
        <span class="ts-badge">TypeScript Edition</span>
    </div>
    <button class="btn" onclick="handleNewBook()">+ Tambah Buku Baru</button>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="totalTitles">0</h3>
            <p>Judul Buku Terdaftar</p>
        </div>
        <div class="stat-card">
            <h3 id="totalStock">0</h3>
            <p>Total Eksemplar Tersedia</p>
        </div>
        <div class="stat-card">
            <h3 id="activeLoans">0</h3>
            <p>Transaksi Peminjaman Aktif</p>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">📚 Katalog Koleksi Buku Digital</div>
        </div>
        <div class="controls">
            <input type="text" id="searchBox" placeholder="Cari judul, penulis, atau ISBN..." oninput="renderAll()" style="flex:1;min-width:220px;">
            <select id="catBox" onchange="renderAll()">
                <option value="">Semua Kategori</option>
                <option value="Teknologi & Pemrograman">Teknologi & Pemrograman</option>
                <option value="Sains & AI">Sains & AI</option>
                <option value="Novel & Sastra">Novel & Sastra</option>
                <option value="Bisnis & Produktivitas">Bisnis & Produktivitas</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Judul Buku</th>
                    <th>Penulis</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="catalogBody"></tbody>
        </table>
    </div>

    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">🧾 Riwayat & Status Peminjaman Mahasiswa</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>NIM</th>
                    <th>Nama Mahasiswa</th>
                    <th>Judul Buku</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="loanBody"></tbody>
        </table>
    </div>
</div>

<script>
    const initialBooks = [
        { id: 101, isbn: "978-0132350884", title: "Clean Code: Agile Software Craftsmanship", author: "Robert C. Martin", category: "Teknologi & Pemrograman", stock: 7 },
        { id: 102, isbn: "978-1098104030", title: "Learning TypeScript: Full-Stack Development", author: "Josh Goldberg", category: "Teknologi & Pemrograman", stock: 10 },
        { id: 103, isbn: "978-0134610993", title: "Artificial Intelligence: A Modern Approach", author: "Stuart Russell & Peter Norvig", category: "Sains & AI", stock: 5 },
        { id: 104, isbn: "978-9793062792", title: "Laskar Pelangi", author: "Andrea Hirata", category: "Novel & Sastra", stock: 12 },
        { id: 105, isbn: "978-0735211292", title: "Atomic Habits", author: "James Clear", category: "Bisnis & Produktivitas", stock: 9 }
    ];

    const initialLoans = [
        { id: 501, bookId: 102, bookTitle: "Learning TypeScript: Full-Stack Development", borrowerName: "DoxxBorx", borrowerNim: "22051099", loanDate: "2026-11-26", status: "Dipinjam" }
    ];

    let books = JSON.parse(localStorage.getItem("perpuskuy_books") || "null") || initialBooks;
    let loans = JSON.parse(localStorage.getItem("perpuskuy_loans") || "null") || initialLoans;

    function persist() {
        localStorage.setItem("perpuskuy_books", JSON.stringify(books));
        localStorage.setItem("perpuskuy_loans", JSON.stringify(loans));
    }

    function renderAll() {
        const q = document.getElementById("searchBox").value.toLowerCase();
        const cat = document.getElementById("catBox").value;

        const filtered = books.filter(b => {
            const mQ = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.isbn.toLowerCase().includes(q);
            const mC = !cat || b.category === cat;
            return mQ && mC;
        });

        document.getElementById("catalogBody").innerHTML = filtered.map(b => `
            <tr>
                <td style="font-family:monospace;color:#94a3b8;">${b.isbn}</td>
                <td><b>${b.title}</b></td>
                <td>${b.author}</td>
                <td><span class="tag">${b.category}</span></td>
                <td><b>${b.stock}</b></td>
                <td>
                    <button class="btn" style="padding:6px 14px;font-size:0.8rem;" onclick="handleBorrow(${b.id})">Pinjam</button>
                </td>
            </tr>
        `).join("");

        document.getElementById("loanBody").innerHTML = loans.map(l => `
            <tr>
                <td>${l.loanDate}</td>
                <td style="font-family:monospace;">${l.borrowerNim}</td>
                <td><b>${l.borrowerName}</b></td>
                <td>${l.bookTitle}</td>
                <td><span class="tag" style="${l.status === 'Dikembalikan' ? 'color:#34d399;border-color:#10b981;' : ''}">${l.status}</span></td>
                <td>
                    ${l.status === 'Dipinjam' ? `<button class="btn-return" onclick="handleReturn(${l.id})">Kembalikan</button>` : '-'}
                </td>
            </tr>
        `).join("");

        document.getElementById("totalTitles").textContent = books.length;
        document.getElementById("totalStock").textContent = books.reduce((acc, b) => acc + b.stock, 0);
        document.getElementById("activeLoans").textContent = loans.filter(l => l.status === "Dipinjam").length;
        persist();
    }

    function handleBorrow(bookId) {
        const book = books.find(b => b.id === bookId);
        if (!book || book.stock <= 0) {
            alert("Stok buku habis!");
            return;
        }
        const name = prompt("Masukkan Nama Mahasiswa Peminjam:", "Mahasiswa");
        if (!name) return;
        const nim = prompt("Masukkan NIM Mahasiswa:", "22051001");
        if (!nim) return;

        book.stock -= 1;
        loans.unshift({
            id: Date.now(),
            bookId: book.id,
            bookTitle: book.title,
            borrowerName: name,
            borrowerNim: nim,
            loanDate: new Date().toISOString().slice(0, 10),
            status: "Dipinjam"
        });
        renderAll();
    }

    function handleReturn(loanId) {
        const loan = loans.find(l => l.id === loanId);
        if (!loan || loan.status === "Dikembalikan") return;
        loan.status = "Dikembalikan";
        const book = books.find(b => b.id === loan.bookId);
        if (book) book.stock += 1;
        renderAll();
    }

    function handleNewBook() {
        const title = prompt("Judul Buku Baru:");
        if (!title) return;
        const author = prompt("Nama Penulis:", "Anonim") || "Anonim";
        const stock = parseInt(prompt("Jumlah Stok:", "5") || "5", 10) || 5;
        books.unshift({
            id: Date.now(),
            isbn: "978-" + Math.floor(1000000000 + Math.random() * 9000000000),
            title,
            author,
            category: "Teknologi & Pemrograman",
            stock
        });
        renderAll();
    }

    renderAll();
</script>
</body>
</html>
